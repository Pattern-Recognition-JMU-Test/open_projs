<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <span class="site-title">{{ site.title | escape }}</span>
      <div class="site-actions">
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
            <path d="M12 3.75a8.25 8.25 0 0 1 0 16.5Z" fill="currentColor"></path>
          </svg>
        </button>
        <div class="site-logos">
          <a href="https://www.uni-wuerzburg.de/" title="Julius-Maximilians-Universität Würzburg">
            <img src="{{ '/assets/img/jmu-logo.svg' | relative_url }}" alt="Julius-Maximilians-Universität Würzburg" width="347" height="152">
          </a>
          <a href="https://www.caidas.uni-wuerzburg.de/" title="CAIDAS – Center for AI and Data Science">
            <img src="{{ '/assets/img/caidas-logo.png' | relative_url }}" alt="CAIDAS – Center for AI and Data Science" width="592" height="201">
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="content" class="wrap">
    <section class="page-hero">
      <div class="page-hero__inner">
        <h1 class="page-title">{{ page.title | escape }}</h1>
        {% if page.lede %}<p class="page-lede">{{ page.lede | escape }}</p>{% endif %}
      </div>
      <div class="page-hero__media" aria-hidden="true">
        <img src="{{ '/assets/img/hero-wsi.jpg' | relative_url }}" alt="">
      </div>
    </section>

    <article class="prose">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title | escape }} · {{ site.tagline | escape }}</p>
      <p>
        <a href="https://www.caidas.uni-wuerzburg.de/pr/">Official group website</a>
        <span aria-hidden="true">·</span>
        <span>Last updated {{ site.time | date: "%-d %B %Y" }}</span>
      </p>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.querySelector(".theme-toggle");
      if (!toggle) return;

      function currentTheme() {
        return root.dataset.theme ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }

      function refreshLabel() {
        toggle.setAttribute(
          "aria-label",
          currentTheme() === "dark" ? "Switch to light theme" : "Switch to dark theme"
        );
      }

      toggle.addEventListener("click", function () {
        var next = currentTheme() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try {
          localStorage.setItem("theme", next);
        } catch (error) {}
        refreshLabel();
      });

      refreshLabel();
    })();
  </script>
</body>
</html>
